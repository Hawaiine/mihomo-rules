# ===========================================
# 地区过滤正则示例
# 适用: Mihomo / clash-meta proxy-providers filter/exclude-filter
# ===========================================

hk_filter:
  filter: "(?i)(香港|Hong.Kong|HongKong|HK|HKG|🇭🇰)"

jp_filter:
  filter: "(?i)(日本|Japan|JP|JPN|Tokyo|🇯🇵)"

us_filter:
  filter: "(?i)(美国|United.States|UnitedStates|US|USA|🇺🇸)"

sg_filter:
  filter: "(?i)(新加坡|Singapore|SG|SGP|🇸🇬)"

tw_filter:
  filter: "(?i)(台湾|Taiwan|TW|TWN|🇹🇼)"

kr_filter:
  filter: "(?i)(韩国|Korea|KR|KOR|Seoul|🇰🇷)"

multi_region_filter:
  filter: "(?i)(香港|HK|日本|JP|美国|US|新加坡|SG|台湾|TW)"

exclude_test:
  exclude-filter: "(?i)(剩余|过期|GIA|CN2|IPv6|测试)"

all_except_test:
  filter: "(?i)(^(?!(剩余|过期|GIA|测试)).*$)"
