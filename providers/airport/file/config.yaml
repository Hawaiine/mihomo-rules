# proxy-providers 片段（type: file）
# path 指向的文件必须是带顶层 proxies: 的订阅，不是这个片段本身。

my_provider:
  type: file
  path: ./providers/my_provider.yaml
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true
  override:
    udp: true
    # skip-cert-verify: false
