# proxy-providers 片段
# 复制到主配置的 proxy-providers: 下面，不要再包一层。
# 参考: https://wiki.metacubex.one/config/proxy-providers/

provider_main:
  type: http
  url: "https://example.com/api/v1/client/subscribe?token=YOUR_TOKEN"
  interval: 86400
  path: ./providers/provider_main.yaml
  # proxy: DIRECT
  # size-limit: 0
  header:
    User-Agent:
      - "mihomo"
    # Authorization:
    #   - "Bearer YOUR_TOKEN"
  # 英文缩写加词边界，避免 PLUS / TRUST 被当成美国。
  filter: "(?i)(香港|\\bHK\\b|HKG|日本|\\bJP\\b|美国|\\bUS\\b|\\bUSA\\b|新加坡|\\bSG\\b|台湾|\\bTW\\b)"
  # 只排除过期和流量耗尽。不要默认排除 GIA / CN2 / IPv6。
  exclude-filter: "(?i)(剩余|过期|流量耗尽|到期)"
  # exclude-type: "ss|http"
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204
  override:
    udp: true
    # skip-cert-verify: false
    # tfo: false
    # mptcp: false
    # udp-over-tcp: false       # Shadowsocks 的 UDP over TCP，不是 TUIC
    # down: "50 Mbps"           # 仅 Hysteria / Hysteria2
    # up: "10 Mbps"
    # ip-version: ipv4-prefer
    # additional-prefix: "[主] "
    # additional-suffix: ""
    # proxy-name:
    #   - pattern: "IPLC-(.*?)倍"
    #     target: "iplc x $1"
    # override-expr 是 yq v4 子集，不是完整 jq。没有变量、reduce、环境变量。
    # override-expr:
    #   - '.name = "[provider] " + .name'

provider_backup:
  type: http
  url: "https://backup.example.com/subscribe?token=YOUR_TOKEN"
  interval: 86400
  path: ./providers/provider_backup.yaml
  proxy: DIRECT
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
  filter: "(?i)(香港|\\bHK\\b|HKG|日本|\\bJP\\b|新加坡|\\bSG\\b|台湾|\\bTW\\b)"
  exclude-filter: "(?i)(剩余|过期|流量耗尽|到期)"
  override:
    udp: true

# 加密订阅。私钥用 `mihomo age keygen` 生成，不要提交真私钥。
provider_encrypted:
  type: http
  url: "https://example.com/encrypted-subscribe"
  interval: 86400
  path: ./providers/provider_encrypted.yaml
  age-secret-key: "AGE-SECRET-KEY-REPLACE-ME"

provider_local:
  type: file
  path: ./providers/provider_local.yaml
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

provider_inline:
  type: inline
  payload:
    - name: "inline-1"
      type: vless
      server: server.example.com
      port: 443
      uuid: "11111111-1111-4111-8111-111111111111"
      udp: true
      tls: true
      servername: example.com
      network: ws
      ws-opts:
        path: "/"
        headers:
          Host: example.com
