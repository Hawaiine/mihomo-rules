# ===========================================
# 机场订阅配置示例 (proxy-providers)
# 适用: Mihomo / clash-meta
# 参考: https://wiki.metacubex.one/en/config/proxy-providers
# ===========================================

# 主要订阅 (填写你的真实订阅链接)
provider_main:
  type: http
  url: "https://example.com/api/v1/client/subscribe?token=your_token_here"
  interval: 86400
  path: ./providers/provider_main.yaml
  header:
    User-Agent:
      - "clash.meta"
    # Authorization:
    #   - "Bearer your_token_here"  # 部分机场需要 Token 认证
  filter: "(?i)(香港|Hong.Kong|HongKong|HK|HKG|日本|Japan|JP|JPN|美国|United.States|UnitedStates|US|新加坡|Singapore|SG|SGP|台湾|Taiwan|TW|TWN)"
  exclude-filter: "(?i)(剩余|过期|GIA|CN2|IPv6)"
  exclude-type: ""  # 排除类型，如 "ss|http"
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204
  override:
    udp: true
    skip-cert-verify: true
    # tfo: false                # TCP Fast Open
    # mptcp: false              # Multipath TCP
    # udp-over-tcp: false       # TUIC 专用
    # down: "50 Mbps"           # 下行带宽限制
    # up: "10 Mbps"             # 上行带宽限制
    # ip-version: ipv4-prefer   # IP 版本偏好
    # additional-prefix: "[主]"  # 节点名前缀
    # additional-suffix: "]"     # 节点名后缀
    # proxy-name:               # 节点名替换规则
    #   - pattern: "IPLC-(.?)倍"
    #     target: "iplc x $1"
    # override-expr:            # 表达式覆盖 (JQ 语法)
    #   - '.name = "[provider] " + .name'
    #   - '.tags |= unique | sort'

# 备用订阅
provider_backup:
  type: http
  url: "https://backup.example.com/subscribe?token=your_backup_token"
  interval: 86400
  path: ./providers/provider_backup.yaml
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
  filter: "(?i)(香港|HK|HKG|日本|JP|JPN|新加坡|SG|SGP|台湾|TW|TWN)"
  exclude-filter: "(?i)(GIA|CN2|IPv6)"
  override:
    udp: true
    skip-cert-verify: true

# 本地文件订阅 (可直接导出订阅文件)
provider_local:
  type: file
  path: ./providers/provider_local.yaml
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

# 嵌入节点 (直接配置节点，无需外部订阅)
provider_inline:
  type: http
  payload:
    - name: "inline-1"
      type: vless
      server: server.example.com
      port: 443
      uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      udp: true
      tls: true
      servername: example.com
      network: ws
      ws-opts:
        path: "/"
        headers:
          Host: example.com
