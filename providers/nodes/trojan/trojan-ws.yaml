# ===========================================
# Trojan + WS (WebSocket)
# 参考: https://wiki.metacubex.one/en/config/proxies/trojan
# ===========================================

- name: "trojan-ws"
  type: trojan
  server: server.example.com
  port: 443
  password: "your-password"
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  udp: true
  sni: example.com
  alpn:
    - h2
    - http/1.1
  network: ws
  ws-opts:
    path: "/trojan"
    headers:
      Host: example.com
