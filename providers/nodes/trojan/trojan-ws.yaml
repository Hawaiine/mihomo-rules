# ===========================================
# Trojan + WebSocket
# 来源: mihomo v1.19.31 adapter/outbound/trojan.go
# ===========================================

- name: "trojan-ws"
  type: trojan
  server: server.example.com
  port: 443
  udp: true
  password: "your-password"                    # 字符串
  network: ws
  ws-opts:
    path: "/ws"
    headers:
      Host: example.com
  sni: example.com                              # TLS SNI
  alpn:
    - h2
    - http/1.1
