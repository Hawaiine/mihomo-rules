# ===========================================
# Trojan + REALITY
# 来源: mihomo v1.19.31 adapter/outbound/trojan.go
# ===========================================

- name: "trojan-reality"
  type: trojan
  server: server.example.com
  port: 443
  udp: true
  password: "your-password"                    # 字符串
  network: tcp
  sni: your-reality-target.example.com         # 必须等于服务端 REALITY dest 的证书名。Trojan 用 sni，不是 servername
  client-fingerprint: chrome
  reality-opts:
    public-key: "your-reality-public-key"      # 32 字节，RawURL base64
    short-id: "your-short-id"                  # hex，最长 8 字节
    # support-x25519mlkem768: false            # 默认 false。服务端未启用该混合密钥
                                               # 交换时不要打开。当前 uTLS 仅 chrome 指纹
                                               # 真正携带。不解决 Xray v26.7.11+ 兼容问题。
