# ===========================================
# Trojan + REALITY
# 参考: https://wiki.metacubex.one/en/config/proxies/trojan
# ===========================================

- name: "trojan-reality"
  type: trojan
  server: server.example.com
  port: 443
  udp: true
  password:
    - "your-password"                          # 密码
  tls: true
  network: tcp
  servername: example.com                      # 回退域名
  client-fingerprint: chrome                    # 推荐 chrome/firefox/safari/random
  reality-opts:
    public-key: "your-reality-public-key"
    short-id: "your-short-id"                  # 允许为空字符串, 留空则使用全 0
  # skip-cert-verify: false                     # 跳过证书验证 (不推荐)
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  # tfo: false                                  # TCP Fast Open
  # mptcp: false                                # Multipath TCP
