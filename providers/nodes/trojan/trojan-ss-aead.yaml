# ===========================================
# Trojan + Shadowsocks AEAD (双层加密)
# 参考: https://wiki.metacubex.one/en/config/proxies/trojan
# ===========================================

- name: "trojan-ss-aead"
  type: trojan
  server: server.example.com
  port: 443
  password: "your-trojan-password"
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  udp: true
  ss-opts:
    enabled: true
    method: aes-128-gcm
    password: "your-ss-password"
  # 注意: 此配置需要服务端也启用 ss-opts
