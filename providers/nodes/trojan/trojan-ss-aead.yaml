# ===========================================
# Trojan + Shadowsocks AEAD (双层加密)
# 参考: https://wiki.metacubex.one/en/config/proxies/trojan
# ===========================================

- name: "trojan-ss-aead"
  type: trojan
  server: server.example.com
  port: 443
  password: "your-trojan-password"
  udp: true
  ss-opts:
    enabled: true
    method: aes-128-gcm
    password: "your-ss-password"
  # 注意: 此配置需要服务端也启用 ss-opts
