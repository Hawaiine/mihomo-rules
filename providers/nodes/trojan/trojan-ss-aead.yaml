# ===========================================
# Trojan + Shadowsocks AEAD (Trojan-Go 的 ss 封装)
# 来源: mihomo v1.19.31 adapter/outbound/trojan.go
# ===========================================

- name: "trojan-ss-aead"
  type: trojan
  server: server.example.com
  port: 443
  udp: true
  password: "your-password"                    # 字符串
  network: tcp
  sni: example.com
  ss-opts:                                     # 不是 ss-password
    enabled: true
    method: chacha20-ietf-poly1305             # aes-128-gcm / aes-256-gcm / chacha20-ietf-poly1305
    password: "your-ss-password"
