# ===========================================
# Trojan 基础配置 (TCP + TLS)
# 来源: mihomo v1.19.31 adapter/outbound/trojan.go
# ===========================================

- name: "trojan-base"
  type: trojan
  server: server.example.com
  port: 443
  udp: true
  password: "your-password"                    # 字符串，不是列表
  sni: example.com                              # TLS SNI
  alpn:                                         # 可选
    - h2
    - http/1.1
  # client-fingerprint: chrome
  # skip-cert-verify: false                     # 仅在证书确实无法验证时打开
