# ===========================================
# Trojan 基础配置
# 参考: https://wiki.metacubex.one/en/config/proxies/trojan
# ===========================================

- name: "trojan-base"
  type: trojan
  server: server.example.com
  port: 443
  password: "your-password"
  udp: true
  sni: example.com
  alpn:
    - h2
    - http/1.1
  # skip-cert-verify: true            # 跳过证书验证 (不推荐)
  # tfo: false                        # TCP Fast Open
  # mptcp: false                      # Multipath TCP
