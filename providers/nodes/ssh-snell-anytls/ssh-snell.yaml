- name: "snell-v4"
  type: snell
  server: server.example.com
  port: 44000                                  # Snell 服务端端口，非固定值
  udp: true
  psk: "your-psk"
  version: 4                                   # 3 / 4，与 v3 模板只差这个字段
  # reuse: true                                 # 复用连接
  # obfs-opts:
  #   mode: tls                                  # tls / http，没有 plain
  #   host: example.com
  # client-fingerprint: chrome
  # tfo: false
