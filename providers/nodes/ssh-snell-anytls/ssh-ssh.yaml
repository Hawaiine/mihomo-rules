# ===========================================
# SSH 基础配置
# 参考: https://wiki.metacubex.one/en/config/proxies/ssh
# ===========================================

- name: "ssh-basic"
  type: ssh
  server: server.example.com
  port: 22
  udp: false                                   # SSH 仅支持 TCP
  user: "username"                             # 用户名
  password: "your-password"                    # 密码
  # private-key: ""                            # 私钥路径
  # passphrase: ""                             # 私钥密码
  # host-key: ""                               # 服务器公钥 (可选)
  # host-key-algorithms: []                    # 公钥算法列表
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  # tfo: false                                  # TCP Fast Open
  # mptcp: false                                # Multipath TCP
