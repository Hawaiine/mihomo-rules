# ===========================================
# AnyTLS 代理
# 参考: https://wiki.metacubex.one/en/config/proxies/anytls
# ===========================================

- name: "anytls-basic"
  type: anytls
  server: server.example.com
  port: 443
  username: "your-username"
  password: "your-password"
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  udp: true
  # sni: example.com
  # skip-cert-verify: false
