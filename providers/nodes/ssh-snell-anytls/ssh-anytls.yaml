# ===========================================
# AnyTLS 基础配置
# 来源: mihomo v1.19.31 adapter/outbound/anytls.go
# 没有 username / client-id 字段。
# ===========================================

- name: "anytls-basic"
  type: anytls
  server: server.example.com
  port: 443
  udp: true
  password: "your-password"
  # sni: example.com                            # TLS SNI
  # client-fingerprint: chrome
  # idle-session-check-interval: 30             # 秒
  # idle-session-timeout: 60                    # 秒
  # min-idle-session: 2                         # 最小空闲会话数
  # client-metadata: '{"device":"phone"}'       # JSON 字符串
  # skip-cert-verify: false                     # 仅在证书确实无法验证时打开
