# ===========================================
# VMess + WebSocket + TLS (抗封锁)
# 参考: https://wiki.metacubex.one/en/config/proxies/vmess
# ===========================================

- name: "vmess-ws-tls"
  type: vmess
  server: server.example.com
  port: 443
  udp: true
  uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  alter-id: 0                                   # 建议 0 (部分机场不支持)
  cipher: auto                                  # 加密方式: auto / aes-128-gcm / chacha20-ietf / none
  tls: true                                     # 启用 TLS (必须)
  network: ws
  servername: cloudflare.com                    # TLS SNI (推荐大站)
  client-fingerprint: chrome                    # 推荐 chrome/firefox/safari/random
  ws-opts:
    path: "/ws?ed=2048"                         # 路径 + ED (Extended Data)
    headers:
      Host: cloudflare.com                      # Host 头 (与 servername 一致)
  # alpn:                                       # HTTP/2 优先
  #   - h2
  #   - http/1.1
  # skip-cert-verify: false                     # 跳过证书验证 (不推荐)
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  # tfo: false                                  # TCP Fast Open
  # mptcp: false                                # Multipath TCP
  # proxy-alive: false                          # 虚假存活连接 (对抗 QoS)
  # smux:                                       # 多路复用
  #   enabled: true
  #   protocol: smux
  #   max-connections: 4
  #   min-streams: 4
  #   statistic: false
  #   only-tcp: false
  #   padding: true
