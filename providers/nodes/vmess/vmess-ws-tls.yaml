# ===========================================
# VMess + WebSocket + TLS
# 来源: mihomo v1.19.31 adapter/outbound/vmess.go
# ===========================================

- name: "vmess-ws-tls"
  type: vmess
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  alterId: 0
  cipher: auto
  tls: true
  network: ws
  servername: cloudflare.com                   # TLS SNI。用真实目标域名，不要用假大站
  client-fingerprint: chrome
  ws-opts:
    path: "/ws?ed=2048"
    headers:
      Host: cloudflare.com                     # 实际 Host 头，需与服务端一致
