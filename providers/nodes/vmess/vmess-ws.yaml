- name: "vmess-ws"
  type: vmess
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  alterId: 0
  cipher: auto
  network: ws
  ws-opts:
    path: "/ws?ed=2048"
    headers:
      Host: example.com
