# ===========================================
# VMess + HTTP/2 + TLS
# 来源: mihomo v1.19.31 adapter/outbound/vmess.go
# ===========================================

- name: "vmess-h2"
  type: vmess
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  alterId: 0
  cipher: auto
  tls: true
  network: h2
  servername: example.com
  client-fingerprint: chrome
  h2-opts:
    host:                                       # h2 的 Host 头列表，需与服务端一致
      - example.com
