# ===========================================
# VMess + gRPC + TLS
# 来源: mihomo v1.19.31 adapter/outbound/vmess.go
# ===========================================

- name: "vmess-grpc"
  type: vmess
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  alterId: 0
  cipher: auto
  tls: true                                     # gRPC 走 HTTP/2，实际需要 TLS
  network: grpc
  servername: example.com
  client-fingerprint: chrome
  grpc-opts:
    grpc-service-name: "service"               # 必须与服务端一致
