# ===========================================
# VMess + TCP
# 来源: mihomo v1.19.31 adapter/outbound/vmess.go
# ===========================================

- name: "vmess-tcp"
  type: vmess
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  alterId: 0                                   # camelCase。写 alter-id 会被忽略，等同 0
  cipher: auto                                  # auto / none / zero / aes-128-gcm / chacha20-poly1305
  # tls: false                                  # 未启用 TLS
  # servername: example.com                     # 启用 TLS 时必填
