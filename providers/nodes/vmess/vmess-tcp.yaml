# ===========================================
# VMess + TCP
# 参考: https://wiki.metacubex.one/en/config/proxies/vmess
# ===========================================

- name: "vmess-tcp"
  type: vmess
  server: server.example.com
  port: 443
  udp: true
  uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  alter-id: 0                                   # 建议 0 (部分机场不支持)
  cipher: auto                                  # 加密方式: auto / aes-128-gcm / chacha20-ietf / none
  # tls: false                                 # 未启用 TLS
  # servername: example.com                    # TLS SNI (启用 tls 时必填)
  # client-fingerprint: random                 # TLS 指纹
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  # tfo: false                                  # TCP Fast Open
  # mptcp: false                                # Multipath TCP
