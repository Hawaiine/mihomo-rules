# ===========================================
# VLESS + REALITY + TCP
# 来源: mihomo v1.19.31 adapter/outbound/vless.go
# ===========================================

- name: "vless-reality"
  type: vless
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  tls: true
  network: tcp                                 # tcp / ws / grpc / h2
  servername: your-reality-target.example.com  # 必须等于服务端 REALITY dest 的证书名
  client-fingerprint: chrome
  reality-opts:
    public-key: "your-reality-public-key"      # 32 字节，RawURL base64，必须与服务端一致
    short-id: "your-short-id"                  # hex，最长 8 字节；空串或留空按全 0 处理
    # support-x25519mlkem768: false            # 默认 false。true 会保留 Client Hello 里的
                                               # X25519MLKEM768。服务端尚未启用该混合密钥
                                               # 交换时不要打开，旧 REALITY 服务端握手会失败。
                                               # v1.19.9 起可用，v1.19.31/Alpha 默认 false。
                                               # 当前 uTLS 仅 chrome 指纹真正携带该密钥交换。
                                               # 不能解决 Xray v26.7.11+ 的不兼容。
  # packet-encoding: xudp                       # xudp / packetaddr，缺省 xudp
  # flow: xtls-rprx-vision                      # 仅 TCP；需要服务端同步开启 Vision
