# ===========================================
# VLESS + REALITY + Vision (XTLS)
# 来源: mihomo v1.19.31 adapter/outbound/vless.go
# ===========================================

- name: "vless-reality-vision"
  type: vless
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  tls: true
  network: tcp                                 # Vision 只在 TCP 上有效
  flow: xtls-rprx-vision                       # 必须与服务端一致
  servername: your-reality-target.example.com  # 必须等于服务端 REALITY dest 的证书名
  client-fingerprint: chrome
  reality-opts:
    public-key: "your-reality-public-key"
    short-id: "your-short-id"
    # support-x25519mlkem768: false            # 默认 false。true 时保留 Client Hello 中的
                                               # X25519MLKEM768，服务端尚未启用该混合密钥
                                               # 交换时不要打开。旧 REALITY 服务端会握手失败。
                                               # 当前 uTLS 仅 chrome 指纹真正携带该密钥交换。
                                               # 与 Xray v26.7.11+ 的兼容性无关。
