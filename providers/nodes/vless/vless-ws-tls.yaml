# ===========================================
# VLESS + WebSocket + TLS
# 参考: https://wiki.metacubex.one/en/config/proxies/vless
# ===========================================

- name: "vless-ws-tls"
  type: vless
  server: server.example.com
  port: 443
  uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  udp: true
  tls: true
  servername: example.com
  network: ws
  ws-opts:
    path: "/"
    headers:
      Host: example.com
