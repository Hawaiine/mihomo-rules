# ===========================================
# VLESS + WebSocket + TLS
# 来源: mihomo v1.19.31 adapter/outbound/vless.go
# ===========================================

- name: "vless-ws-tls"
  type: vless
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  tls: true
  network: ws
  servername: example.com                      # TLS SNI，也是 Host 头的默认值
  client-fingerprint: chrome
  ws-opts:
    path: "/ws?ed=2048"
    headers:
      Host: example.com
  # packet-encoding: xudp
