# ===========================================
# VLESS + WebSocket
# 来源: mihomo v1.19.31 adapter/outbound/vless.go
# ===========================================

- name: "vless-ws"
  type: vless
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  network: ws
  ws-opts:
    path: "/ws?ed=2048"                       # ?ed= 是 early data 参数，按服务端配置
    headers:
      Host: example.com
