# ===========================================
# VLESS + WebSocket
# 参考: https://wiki.metacubex.one/en/config/proxies/vless
# ===========================================

- name: "vless-ws"
  type: vless
  server: server.example.com
  port: 443
  udp: true
  uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  network: ws
  ws-opts:
    path: "/ws?ed=2048"                        # 路径 + ED (Extended Data)
    headers:
      Host: example.com                        # Host 头
  # tls: false                                 # 未启用 TLS
  # servername: example.com                    # TLS SNI (启用 tls 时必填)
  # client-fingerprint: random                 # TLS 指纹
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  # xudp: true                                  # 启用 XUDP (QUIC)
  # packet-encoding: xudp                       # 数据包编码 (xudp/packetaddr)
  # smux:                                       # 多路复用 (可选)
  #   enabled: true
  #   protocol: smux
  #   max-connections: 4
  #   min-streams: 4
  #   statistic: false
  #   only-tcp: false
  #   padding: true
