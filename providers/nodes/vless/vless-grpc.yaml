# ===========================================
# VLESS + gRPC + TLS
# 来源: mihomo v1.19.31 adapter/outbound/vless.go
# ===========================================

- name: "vless-grpc"
  type: vless
  server: server.example.com
  port: 443
  udp: true
  uuid: "11111111-1111-4111-8111-111111111111"
  tls: true
  network: grpc
  servername: example.com
  client-fingerprint: chrome
  grpc-opts:
    grpc-service-name: "service"              # 必须与服务端一致
  # packet-encoding: xudp
