# ===========================================
# VLESS + gRPC
# 参考: https://wiki.metacubex.one/en/config/proxies/vless
# ===========================================

- name: "vless-grpc"
  type: vless
  server: server.example.com
  port: 443
  uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  udp: true
  tls: true
  servername: example.com
  network: grpc
  grpc-opts:
    grpc-service-name: "service"
  # reality-opts:                      # 可叠加 REALITY
  #   public-key: "..."
  #   short-id: "..."
