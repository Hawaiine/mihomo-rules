# ===========================================
# WireGuard 标准配置
# 来源: mihomo v1.19.31 adapter/outbound/wireguard.go
# ===========================================

- name: "wg-basic"
  type: wireguard
  server: server.example.com
  port: 51820
  ip: 10.0.0.2/32                              # 本机虚拟接口地址
  ipv6: "::2/128"                              # 可选
  private-key: "your-base64-private-key"      # Base64
  # mtu: 1420
  # workers: 4
  peers:
    - server: server.example.com               # 对端地址
      port: 51820
      public-key: "your-base64-peer-public-key"   # 对端公钥
      # pre-shared-key: "your-base64-psk"     # 带连字符
      # reserved: [0, 0, 0]                    # 保留字节
      allowed-ips:
        - "0.0.0.0/0"
        - "::/0"
  # persistent-keepalive: 30                    # 秒
  # remote-dns-resolve: false
  # dns:
  #   - 1.1.1.1
  # refresh-server-ip-interval: 60
