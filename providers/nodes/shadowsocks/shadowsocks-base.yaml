# ===========================================
# Shadowsocks (SS) 基础配置
# 参考: https://wiki.metacubex.one/en/config/proxies/shadowsocks
# ===========================================

- name: "ss-base"
  type: ss
  server: server.example.com
  port: 443
  cipher: chacha20-ietf-poly1305    # 加密方式
  password: "your-password"          # 密码
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  udp: true                          # 启用 UDP (默认)
  # plugin: obfs                     # 插件: obfs / v2ray-plugin
  # plugin-opts:
  #   mode: tls                      # obfs 模式: tls / http
  #   host: example.com              # 混淆域名
  #   path: /                        # 路径 (v2ray-plugin)

# 支持的加密方式:
# - aes-128-gcm / aes-192-gcm / aes-256-gcm
# - aes-128-ctr / aes-192-ctr / aes-256-ctr
# - chacha20-ietf-poly1305 (推荐)
# - xchacha20-ietf-poly1305
# - 2022-blake3-aes-128-gcm / 2022-blake3-aes-256-gcm (SS 2022)
