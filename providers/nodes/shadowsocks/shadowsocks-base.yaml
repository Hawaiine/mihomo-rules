# ===========================================
# Shadowsocks 基础配置 (AEAD)
# 来源: mihomo v1.19.31 adapter/outbound/shadowsocks.go
# ===========================================

- name: "ss-base"
  type: ss
  server: server.example.com
  port: 443
  udp: true
  cipher: chacha20-ietf-poly1305               # 有效值含 aes-*-gcm / chacha20-ietf-poly1305
                                                # / xchacha20-ietf-poly1305 / 2022-blake3-*
  password: "your-password"                    # 字符串

# 深度加固可用于 VMess 的 global-padding 等字段不适用于 SS。
# SS 2022 密钥长度见 ../../shadowsocks/README.md。
