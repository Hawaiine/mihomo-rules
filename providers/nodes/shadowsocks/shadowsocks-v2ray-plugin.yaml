# ===========================================
# Shadowsocks + v2ray-plugin
# 来源: mihomo v1.19.31 adapter/outbound/shadowsocks.go
# ===========================================

- name: "ss-v2ray-plugin"
  type: ss
  server: server.example.com
  port: 443
  udp: true
  cipher: chacha20-ietf-poly1305
  password: "your-password"
  plugin: v2ray-plugin
  plugin-opts:
    mode: websocket                            # websocket / http
    host: example.com                          # 混淆域名
    path: /                                    # 路径
    # tls: true                                # 是否启用 TLS
