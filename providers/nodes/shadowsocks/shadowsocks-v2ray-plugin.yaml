# ===========================================
# Shadowsocks + v2ray-plugin (WebSocket 伪装)
# 参考: https://wiki.metacubex.one/en/config/proxies/shadowsocks
# ===========================================

- name: "ss-v2ray-plugin"
  type: ss
  server: server.example.com
  port: 443
  cipher: chacha20-ietf-poly1305
  password: "your-password"
  # ip-version: dual                            # IP版本: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer
  # interface-name: ""                          # 网络接口 (如: eth0, tailscale0)
  # routing-mark: 0                             # 路由标记
  udp: true
  plugin: v2ray-plugin
  plugin-opts:
    mode: websocket                    # 固定为 websocket
    host: example.com                  # 伪装域名
    path: /ss                          # 路径
    # tls: true                        # 启用 WSS (推荐)
    # skip-cert-verify: true
    # multiplex: true                  # 多路复用 (需 server 端支持)
    # multiplex-options:
    #   protocol: h2mux
    #   stream-concurrency: 256
