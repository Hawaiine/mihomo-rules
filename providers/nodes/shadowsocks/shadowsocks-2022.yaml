# ===========================================
# Shadowsocks 2022
# 来源: mihomo v1.19.31 adapter/outbound/shadowsocks.go
# ===========================================

- name: "ss-2022"
  type: ss
  server: server.example.com
  port: 443
  udp: true
  cipher: 2022-blake3-aes-256-gcm
  # 密码 = base64(主密钥)。主密钥 32 字节，例如 openssl rand -base64 32。
  # mihomo v1.19.31 实测：写成 base64(主密钥):base64(psk) 两段会报
  # "bad key length, required 32, got 16"，即第二段会被当成主密钥解析。
  # 预共享密钥请放在服务端配置，客户端只写主密钥。
  password: "REPLACE-WITH-BASE64-32B-KEY"
