# ===========================================
# Hysteria v1 + 端口跳跃
# 来源: mihomo v1.19.31 adapter/outbound/hysteria.go
# ===========================================

- name: "hy1-portjump"
  type: hysteria
  server: server.example.com
  port: 443                                   # 起始端口
  ports: "443-8443"                           # 跳跃范围，服务端需开放整段
  udp: true
  auth-str: "your-auth-string"
  up: "50 Mbps"                               # 必填，源码无 omitempty
  down: "200 Mbps"                             # 必填
  # hop-interval: 30                          # 换端口间隔（秒）
  # sni: example.com
  # alpn:
  #   - h3
  # obfs: "your-obfs-string"
  # protocol: udp
  # skip-cert-verify: false
  # disable-mtu-discovery: false
