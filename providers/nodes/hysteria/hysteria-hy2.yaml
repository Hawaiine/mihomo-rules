# ===========================================
# Hysteria2 基础配置
# 来源: mihomo v1.19.31 adapter/outbound/hysteria2.go
# ===========================================

- name: "hy2-basic"
  type: hysteria2
  server: server.example.com
  port: 443
  udp: true
  password: "your-password"                    # 认证密码
  # up: "50 Mbps"                              # 上行带宽，不填则自动探测
  # down: "200 Mbps"                           # 下行带宽
  # sni: example.com                           # TLS SNI
  # alpn:
  #   - h3
  # obfs: salamander                           # 混淆类型
  # obfs-password: "your-obfs-password"        # 与 obfs 配对
  # skip-cert-verify: false                    # 仅在证书确实无法验证时打开
