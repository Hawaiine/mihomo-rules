# ===========================================
# Hysteria2 基础配置 (推荐)
# 参考: https://wiki.metacubex.one/en/config/proxies/hysteria2
# ===========================================

- name: "hy2-basic"
  type: hysteria2
  server: server.example.com
  port: 443
  password: "your-password"
  udp: true
  # up: "50 Mbps"                   # 上行带宽 (不填则自动检测)
  # down: "200 Mbps"                # 下行带宽
  # sni: example.com                # TLS SNI
  # skip-cert-verify: false         # 跳过证书验证
  # obfs:                           # 混淆 (可选)
  #   type: salamander
  #   password: "your-obfs-password"
