# ===========================================
# Hysteria2 优化配置 (适合低延迟场景)
# ===========================================

- name: "hy2-optimized"
  type: hysteria2
  server: server.example.com
  port: 443
  password: "your-password"
  udp: true
  up: "50 Mbps"
  down: "200 Mbps"
  sni: example.com
  # 以下参数可优化延迟
  # recv-window-cc: 8388608         # 接收窗口拥塞控制
  # max-conn-br: 16777216           # 最大连接数 (bits)
  # disable-mtu-discovery: false    # 禁用 Path MTU 发现
