# ===========================================
# Hysteria2 固定带宽写法
# 来源: mihomo v1.19.31 adapter/outbound/hysteria2.go
# 这不是「自动优化」，只是把带宽写死成固定值。
# 源码里 up-speed/down-speed (Mbps 整数) 会覆盖 up/down。
# ===========================================

- name: "hy2-fixed-bw"
  type: hysteria2
  server: server.example.com
  port: 443
  udp: true
  password: "your-password"
  up: "50 Mbps"                               # 与 up-speed 二选一
  down: "200 Mbps"
  # up-speed: 50                              # Mbps 整数，优先于 up
  # down-speed: 200
  sni: example.com
  alpn:
    - h3
  # skip-cert-verify: false
