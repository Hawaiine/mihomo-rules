# ===========================================
# Hysteria v1 基础配置
# 来源: mihomo v1.19.31 adapter/outbound/hysteria.go
# ===========================================

- name: "hy1-basic"
  type: hysteria
  server: server.example.com
  port: 443
  udp: true
  auth-str: "your-auth-string"                # 不是 auth_str。up/down 为必填
  up: "50 Mbps"                               # 必填，源码无 omitempty
  down: "200 Mbps"                             # 必填
  # auth: "base64-auth-string"                # auth 的 base64 形式，与 auth-str 二选一
  # sni: example.com                           # TLS SNI
  # alpn:
  #   - h3
  # obfs: "your-obfs-string"                   # xplus 混淆字符串，不是对象
  # protocol: udp                              # 协议名
  # obfs-protocol: udp                         # 协议名（兼容 Stash 写法）
  # skip-cert-verify: false                    # 仅在证书确实无法验证时打开
  # disable-mtu-discovery: false
