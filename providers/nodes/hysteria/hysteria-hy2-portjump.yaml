# ===========================================
# Hysteria2 + 端口跳跃
# 来源: mihomo v1.19.31 adapter/outbound/hysteria2.go
# ===========================================

- name: "hy2-portjump"
  type: hysteria2
  server: server.example.com
  port: 443                                   # 起始端口
  ports: "443-8443"                           # 跳跃范围，服务端需开放整段
  udp: true
  password: "your-password"
  # hop-interval: "30s"                        # 换端口间隔，可带单位；纯数字按秒
  # up: "50 Mbps"
  # down: "200 Mbps"
  # sni: example.com
  # alpn:
  #   - h3
  # skip-cert-verify: false
