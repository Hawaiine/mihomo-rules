# ===========================================
# TUIC v5
# 来源: mihomo v1.19.31 adapter/outbound/tuic.go
# v5 只有 token 一个凭据。
# ===========================================

- name: "tuic-v5"
  type: tuic
  server: server.example.com
  port: 443
  udp: true
  token: "your-token"                          # v5 认证字符串
  sni: server.example.com                      # TLS SNI
  alpn:
    - h3
  # congestion-controller: bbr                  # cubic / bbr，默认 bbr
  # udp-relay-mode: native                      # native / quic，默认 native
  # heartbeat-interval: 10000                   # 毫秒
  # request-timeout: 8000                       # 毫秒
  # max-udp-relay-packet-size: 1500             # 字节
  # disable-sni: false
  # skip-cert-verify: false                     # 仅在证书确实无法验证时打开
