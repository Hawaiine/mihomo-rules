name: Robot PR (bot-authored)

# 目的：让 **PR 作者变成机器人**（github-actions[bot], app 15368），从而让可信审批人
# Hawaiine（user.id 152380613）能够对一个「不是自己创建」的 PR 提交正式 APPROVED。
#
# 为什么必须这样：GitHub 不允许 PR 作者批准自己的 PR。本仓库唯一可信审批人自己写的分支，
# 若由本人开 PR，就永远无法获得有效审批——这不是代码缺陷，而是平台规则。
#
# 设计边界（不可放宽）：
#   * 只用内置 GITHUB_TOKEN，不引入 App / PAT；
#   * 本 workflow 在 **main 上的受信代码** 上执行，只通过 API 读取 source_branch 的
#     ref/compare/body —— 绝不检出、绝不执行 source_branch 的代码；
#   * 分支名/标题/body 一律当数据（严格字符集 + 长度上限），不拼进 shell；
#   * 幂等：同 head+base 已有 open PR 时只更新标题/body，不重复创建；多候选即歧义失败；
#   * 写入后**回读**并校验 author 必须是机器人、head SHA / head ref / base repo / base ref
#     与请求完全一致；任何不符即失败，不发布成功结论；
#   * 不创建 Check Run、不发布 commit status —— 必需检查由 pr-verify / route-a-status 负责。
#
# 已知平台语义：由 GITHUB_TOKEN 创建的 PR 会触发 pull_request，但 run 处于
# **approval-required** 状态，需有写权限的用户在 PR 上点 "Approve workflows to run"。
# 本 workflow 不改变这一点，也不把「run 存在」当成「检查已运行」。

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 要提 PR 的源分支（不得为 main/master）
        required: true
        type: string
      base_branch:
        description: 目标分支（仅允许 main）
        required: false
        default: main
        type: string
      title:
        description: PR 标题
        required: true
        type: string
      body_file:
        description: 可选；在 source_branch 上读取的 PR 正文文件路径（只作为数据）
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: robot-pr-${{ inputs.source_branch }}
  cancel-in-progress: false

jobs:
  create-robot-pr:
    name: create-robot-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read          # 读取 source_branch 的 ref / compare（不检出）
      pull-requests: write    # 创建/更新 PR（作者即机器人身份）

    steps:
      - name: 📥 检出默认分支（受信脚本；不检出 source_branch）
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 🧪 预校验输入（分支名/标题字符集；不触网）
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          python3 scripts/ci/robot_pr.py validate \
            --source "$SOURCE_BRANCH" --base "$BASE_BRANCH"

      - name: 📝 准备 PR 正文（只作数据；按字符数上限截断）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          BODY_FILE: ${{ inputs.body_file }}
          TITLE: ${{ inputs.title }}
          OUT: ${{ runner.temp }}/robot-pr-body.md
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.error, urllib.parse, urllib.request

          out_path = os.environ["OUT"]
          title = os.environ["TITLE"]
          body_file = os.environ.get("BODY_FILE", "").strip()
          repo = os.environ["REPO"]
          ref = os.environ["SOURCE_BRANCH"]
          token = os.environ["GH_TOKEN"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          MAX = 60000

          def fail(msg):
              print(f"❌ {msg}")
              raise SystemExit(1)

          body = ""
          if body_file:
              if not re.match(r"^[A-Za-z0-9._/-]{1,200}$", body_file) or ".." in body_file:
                  fail(f"body_file 路径不合法: {body_file!r}")
              url = f"{api}/repos/{repo}/contents/{body_file}?ref={urllib.parse.quote(ref, safe='')}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mihomo-robot-pr"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      doc = json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as exc:
                  fail(f"读取 body 文件失败: HTTP {exc.code}")
              if not isinstance(doc, dict) or doc.get("encoding") != "base64":
                  fail("body 文件响应不符合 contents API 约定")
              try:
                  body = base64.b64decode(doc.get("content") or "").decode("utf-8", "replace")
              except Exception as exc:  # noqa: BLE001
                  fail(f"body 解码失败: {type(exc).__name__}")
          if not body.strip():
              body = title
          if len(body) > MAX:
              body = body[:MAX] + "\n\n<!-- truncated by robot-pr workflow -->"
          with open(out_path, "w", encoding="utf-8") as fh:
              fh.write(body)
          print(f"✅ 正文已准备：{len(body)} 字符")
          PY

      - name: 🤖 创建或更新机器人作者 PR（幂等 + 回读校验）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ runner.temp }}/robot-pr-body.md
          REPORT: ${{ runner.temp }}/robot-pr.json
        run: |
          python3 scripts/ci/robot_pr.py create-or-update \
            --repo "$REPO" \
            --source "$SOURCE_BRANCH" \
            --base "$BASE_BRANCH" \
            --title "$TITLE" \
            --body-file "$BODY" \
            --json "$REPORT"

      - name: 📋 汇总结果（机器可读）
        if: always()
        env:
          REPORT: ${{ runner.temp }}/robot-pr.json
        run: |
          python3 - "$REPORT" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          if not os.path.exists(path):
              print("（没有生成报告：创建步骤未完成，按失败处理）")
              raise SystemExit(0)
          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)
          ev = report.get("evidence") or {}
          print(json.dumps({"ok": report.get("ok"),
                            "action": report.get("action"),
                            "problems": report.get("problems"),
                            "pr": ev.get("number"),
                            "author": ev.get("author"),
                            "author_id": ev.get("author_id"),
                            "head_sha": ev.get("head_sha"),
                            "base_ref": ev.get("base_ref"),
                            "base_repo": ev.get("base_repo")},
                           ensure_ascii=False, indent=1))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"**robot-pr**: ok={report.get('ok')} "
                           f"action={report.get('action')} "
                           f"PR=#{ev.get('number')} author={ev.get('author')} "
                           f"head={ev.get('head_sha')}\n")
          PY

      - name: ⬆️ 上传证据
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: robot-pr-result
          path: ${{ runner.temp }}/robot-pr.json
          retention-days: 7
          if-no-files-found: ignore
