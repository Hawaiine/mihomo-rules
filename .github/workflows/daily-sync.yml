name: 每日规则同步（PR-first 唯一入口）

# 本文件是仓库**唯一**的定时自动同步入口（Route A）。
#
# 设计要点：
#   * 这里不含任何 `git push` / 任何 ref 写入：所有写操作都在被调用的
#     `candidate-pr-sync.yml` 里，且只写候选分支与 PR，绝不推送 main。
#   * 历史版本曾直接推送默认分支（HEAD:<默认分支>）；该路径已彻底删除（守卫逐行扫描本文件，
#     出现 push / 动态 ref / refs 写入即失败）。
#   * 认证只用内置 GITHUB_TOKEN，不使用 GitHub App / PAT。
#   * `CANDIDATE_SYNC_ENABLED` 未设为 "true" 时整体跳过（安全默认关闭）。
#   * 手动触发同样走本入口，因而无法绕过 PR-first。

on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 北京 = 22:00 UTC
  workflow_dispatch:

permissions:
  contents: write        # 候选分支推送
  pull-requests: write   # 候选 PR 创建/更新（需仓库允许 Actions 创建 PR）
  statuses: write        # route-a/verify 状态发布

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    uses: ./.github/workflows/candidate-pr-sync.yml
    with:
      reason: daily-sync
    permissions:
      contents: write
      pull-requests: write
      statuses: write
