name: 候选分支更新（PR-first · Route A）

# Route A（用户已确认）：认证只用内置 GITHUB_TOKEN，不使用 GitHub App / PAT。
#   * daily-sync.yml 是**唯一**定时入口（schedule + workflow_dispatch），通过 workflow_call
#     调用本文件；本文件自身不再带 schedule，避免同日双入口。
#   * generate job 只读；publish job 用 GITHUB_TOKEN（contents: write + pull-requests: write）
#     推送候选分支并创建/更新 PR，绝不推送默认分支；push 前有硬断言。
#   * 因为 GITHUB_TOKEN 创建的 PR 不触发 pull_request workflow，本流程在同一次运行内用
#     verify job（trusted 脚本来自 main，候选树只作数据）执行校验，并以
#     POST /statuses/{head_sha} 发布 `route-a/verify` context。Ruleset 应引用该 context
#     （check-run 无法由 GITHUB_TOKEN 创建）。
#   * 平台前提：仓库必须允许 Actions 创建 PR（Settings → Actions → General →
#     "Allow GitHub Actions to create and approve pull requests"）。未开启时 PR 创建返回
#     403，本流程 fail-closed 并报告 BLOCKED，**绝不**回退到 App/PAT。
#   * 自动合并仍由 CANDIDATE_AUTOMERGE_ENABLED 二次门控；只在 Ruleset 已引用
#     route-a/verify 后才可能成立，否则保持关闭。
#
# 关于基线 ref：generate/publish 都基于当前默认分支——这是**生成器**而非门禁，
# 其输出只能进入候选分支，无法直接影响默认分支。门禁（pr-verify.yml）则一律只检出被检 SHA。

on:
  workflow_call:
    inputs:
      reason:
        description: 触发原因（仅用于审计输出）
        required: false
        type: string
        default: manual
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-pr-sync
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  CANDIDATE_BRANCH: candidate/rules-update
  BASE_BRANCH: main

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: 🔒 启用开关检查（默认安全关闭）
        id: check
        run: |
          set -euo pipefail
          if [ "${{ vars.CANDIDATE_SYNC_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ CANDIDATE_SYNC_ENABLED=true：继续候选更新"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ CANDIDATE_SYNC_ENABLED 未启用：候选更新保持关闭（安全默认）"
          fi

  lock:
    name: lock
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # 状态 ref（D-15 控制平面）
    outputs:
      generation: ${{ steps.acquire.outputs.generation }}
    steps:
      - name: 📥 检出默认分支（受信脚本）
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: 🚧 强制要求状态锁已启用（P0-2：未启用即 fail-closed，不产生任何副作用）
        env:
          GATE_STATE_ENABLED: ${{ vars.GATE_STATE_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/gate_lock.py require-enabled

      - name: 🔒 获取逻辑锁（CAS；占用/暂停即失败关闭）
        id: acquire
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/gate_lock.py --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            acquire --base-sha "${GITHUB_SHA}" --target-ref "refs/heads/${CANDIDATE_BRANCH}" \
            --trigger "${GITHUB_EVENT_NAME}" | tee "$RUNNER_TEMP/lock.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("generation=%s" % d["generation"])' \
            "$RUNNER_TEMP/lock.json" >> "$GITHUB_OUTPUT"

  generate:
    name: generate
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.pack.outputs.changed }}
      base_sha: ${{ steps.pack.outputs.base_sha }}
      tree_sha: ${{ steps.pack.outputs.tree_sha }}
    steps:
      - name: 📥 检出默认分支（候选变更的基线）
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: python3 -m pip install pyyaml

      - name: 🎨 拉取固定版本 Oasisic-Icons
        uses: actions/checkout@v7
        with:
          repository: Hawaiine/Oasisic-Icons
          ref: f0f3bc2a44616885682ee5f0e5921540b964e2d8
          path: Oasisic-Icons
          persist-credentials: false

      - name: 🛡️ 生成前只读 guard（workflow 策略 / 通用 guard / 配置 / 规则集 / README 口径 / 单测）
        env:
          MIHOMO_ICON_REPO: ${{ github.workspace }}/Oasisic-Icons
          # verify_general_pr.py 需要 PR_BASE_SHA / PR_HEAD_SHA（无 origin/main 回退）；
          # 候选生成以当前默认分支 tip 为基线，故两者都取 github.sha。
          PR_BASE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_workflow_policy.py
          python3 scripts/ci/verify_general_pr.py
          python3 scripts/verify_configs.py
          python3 scripts/verify_rulesets.py
          python3 scripts/readme_stats.py --check
          python3 -m unittest discover -s scripts/tests -q

      - name: 🔄 执行上游同步（写入候选工作树，不提交、不推送、不通知）
        run: python3 scripts/batch_update.py --no-commit
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: 📊 刷新 README 统计口径
        run: python3 scripts/readme_stats.py --update

      - name: 🔍 生成后复检（配置 / 规则集 / README 口径 / 单测）
        env:
          MIHOMO_ICON_REPO: ${{ github.workspace }}/Oasisic-Icons
        run: |
          set -euo pipefail
          python3 scripts/verify_configs.py
          python3 scripts/verify_rulesets.py
          python3 scripts/readme_stats.py --check
          python3 -m unittest discover -s scripts/tests -q

      - name: 📦 产出候选补丁（纯数据，供 publish 应用）
        id: pack
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add -A ruleset configs README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
            echo "⏸️ 无候选变更"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tree_sha=$(git write-tree)" >> "$GITHUB_OUTPUT"
            git diff --cached --binary > "$RUNNER_TEMP/candidate.patch"
            git diff --cached --name-only | sort > "$RUNNER_TEMP/changed-files.txt"
            echo "变更文件数：$(wc -l < "$RUNNER_TEMP/changed-files.txt")"
          fi

      - name: ⬆️ 上传候选补丁
        if: steps.pack.outputs.changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: candidate-patch
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/changed-files.txt
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [gate, lock, generate]
    if: needs.gate.outputs.enabled == 'true' && needs.generate.outputs.changed == 'true'
        && needs.lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # 推候选分支（绝不推 main）
      pull-requests: write     # 建/更新候选 PR（需仓库允许 Actions 创建 PR）
      statuses: write          # 发布 route-a/verify（在精确 head SHA 上）
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.consistency.outputs.head_sha }}
      publish_skipped: ${{ steps.auth.outputs.blocked }}
    steps:
      - name: 📥 检出默认分支（**不**检出候选内容；本 job 不执行候选代码）
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: ⬇️ 下载候选补丁
        uses: actions/download-artifact@v5
        with:
          name: candidate-patch
          path: ${{ runner.temp }}

      - name: 🧷 候选数据存在性检查（缺失即失败，不静默继续）
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/candidate.patch" || { echo "❌ 缺少候选补丁"; exit 1; }
          test -s "$RUNNER_TEMP/changed-files.txt" || { echo "❌ 缺少变更文件清单"; exit 1; }
          echo "✅ 候选数据就位（$(wc -l < "$RUNNER_TEMP/changed-files.txt") 个文件）"

      - name: 🔑 Route A 认证检查（只用内置 GITHUB_TOKEN；不回退 App/PAT）
        id: auth
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "❌ 缺少 GITHUB_TOKEN：Route A 无法发布（fail-closed）"; exit 1
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "✅ 认证路径 = 内置 GITHUB_TOKEN（contents/pull-requests/statuses 写权限）"

      - name: 🌿 创建/更新候选分支（幂等；只推候选分支；head SHA 取自真实远端状态）
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 硬断言：候选分支绝不等于目标分支
          if [ "$CANDIDATE_BRANCH" = "main" ] || [ "$CANDIDATE_BRANCH" = "$BASE_BRANCH" ]; then
            echo "❌ 候选分支名非法：$CANDIDATE_BRANCH"; exit 1
          fi
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # 可信脚本副本：在应用候选补丁**之前**复制，确保之后执行的不是候选内容
          mkdir -p "$RUNNER_TEMP/trusted"
          cp scripts/ci/candidate_sha.py "$RUNNER_TEMP/trusted/"

          # 凭据通过 GIT_ASKPASS 注入（不进入 argv、不进入 remote URL、不落盘）
          cat > "$RUNNER_TEMP/askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' "x-access-token" ;;
            *) printf '%s' "${GITHUB_TOKEN}" ;;
          esac
          ASKPASS
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          git config user.name "pr-first-bot[bot]"
          git config user.email "pr-first-bot[bot]@users.noreply.github.com"
          git checkout -B "$CANDIDATE_BRANCH"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git commit -q -m "🔄 候选规则更新 $(date +'%Y-%m-%d %H:%M:%S')"
          LOCAL_SHA="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse 'HEAD^{tree}')"

          # 远端候选分支当前状态（只读）
          REMOTE_EXISTS=false; REMOTE_SHA=""; REMOTE_TREE=""
          if git ls-remote --exit-code --heads origin "$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            REMOTE_EXISTS=true
            git fetch --quiet origin "$CANDIDATE_BRANCH"
            REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
            REMOTE_TREE="$(git rev-parse 'FETCH_HEAD^{tree}')"
          fi
          TREES_EQUAL=false
          if [ "$REMOTE_EXISTS" = "true" ] && [ "$NEW_TREE" = "$REMOTE_TREE" ]; then TREES_EQUAL=true; fi

          # 已有 PR 的状态（只读；含 closed，避免自动复活被人工关闭的 PR）
          PR_STATE="none"; PR_HEAD="-"
          EXISTING="$(curl -sS -H "Authorization: Bearer ${APP_TOKEN}" -H "Accept: application/vnd.github+json" \
            -w $'\n%{http_code}' "${API}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${CANDIDATE_BRANCH}&base=${BASE_BRANCH}")"
          EXIST_CODE="$(printf '%s' "$EXISTING" | tail -n1)"
          test "$EXIST_CODE" = "200" || { echo "❌ 查询已有 PR 失败：HTTP $EXIST_CODE"; exit 1; }
          printf '%s' "$EXISTING" | sed '$d' > "$RUNNER_TEMP/existing-prs.json"
          read -r PR_STATE PR_HEAD <<<"$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print("%s %s" % (d[0]["state"], d[0]["head"]["sha"]) if d else "none -")' "$RUNNER_TEMP/existing-prs.json")"

          # 幂等决策：树一致则跳过推送，且 head 取**远端 ref SHA**
          python3 "$RUNNER_TEMP/trusted/candidate_sha.py" decide \
            --remote-ref-exists "$REMOTE_EXISTS" --remote-ref-sha "${REMOTE_SHA:--}" \
            --local-sha "$LOCAL_SHA" --trees-equal "$TREES_EQUAL" \
            --pr-state "$PR_STATE" --pr-head-sha "$PR_HEAD" \
            --json "$RUNNER_TEMP/candidate-decision.json"
          DECISION="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["decision"])' "$RUNNER_TEMP/candidate-decision.json")"
          EXPECTED="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["expected_head_sha"])' "$RUNNER_TEMP/candidate-decision.json")"

          case "$DECISION" in
            skip-push)
              echo "⏸️ 候选树未变化：跳过推送；实际 head = 远端 ref SHA ${EXPECTED}"
              ;;
            push)
              if [ "$REMOTE_EXISTS" = "true" ]; then
                git push --force-with-lease="${CANDIDATE_BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
              else
                git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
              fi
              echo "✅ 已推送候选分支 $CANDIDATE_BRANCH（local=${LOCAL_SHA:0:12}）"
              ;;
            *)
              echo "❌ 决策=${DECISION}：fail-closed，不推送"; exit 1
              ;;
          esac
          echo "expected_head_sha=${EXPECTED}" >> "$GITHUB_OUTPUT"

      - name: 🔁 创建或更新 PR（幂等；App 身份创建 ⇒ 正常触发 pull_request 验证）
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          {
            echo "## 候选规则更新（PR-first 自动化）"
            echo
            echo "- 由 \`candidate-pr-sync\` 自动创建/更新；来源分支 \`${CANDIDATE_BRANCH}\`，目标 \`${BASE_BRANCH}\`。"
            echo "- \`.github/workflows/daily-sync.yml\` **保持禁用**（未重新启用直推默认分支）。"
            echo "- 新系统只通过候选分支与 PR 工作，绝不直接推送 \`${BASE_BRANCH}\`。"
            echo "- Auto-merge 只依赖 GitHub Ruleset 与真实 required checks（严格 success 口径）；ChatGPT 不在日常运行路径中。"
            echo "- 变更文件："
            sed 's/^/- `/' "$RUNNER_TEMP/changed-files.txt" | sed 's/$/`/'
          } > "$BODY_FILE"

          api() {
            local method="$1" path="$2" data="${3:-}" expect="${4:-200}" out code body
            if [ -n "$data" ]; then
              out="$(curl -sS -X "$method" -H "Authorization: Bearer ${APP_TOKEN}" \
                -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" -d "$data" -w $'\n%{http_code}' "${API}${path}")"
            else
              out="$(curl -sS -X "$method" -H "Authorization: Bearer ${APP_TOKEN}" \
                -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                -w $'\n%{http_code}' "${API}${path}")"
            fi
            code="$(printf '%s' "$out" | tail -n1)"
            body="$(printf '%s' "$out" | sed '$d')"
            if [ "$code" != "$expect" ]; then
              printf '❌ %s %s -> HTTP %s（期望 %s）：%s\n' "$method" "$path" "$code" "$expect" "${body:0:400}" >&2
              return 1
            fi
            printf '%s' "$body"
          }

          EXISTING="$(api GET "/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${CANDIDATE_BRANCH}&base=${BASE_BRANCH}")"
          NUMBER="$(printf '%s' "$EXISTING" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["number"] if d else "")')"
          export BODY_FILE HEAD_BR="$CANDIDATE_BRANCH" BASE_BR="$BASE_BRANCH"
          export PR_TITLE="🔄 候选规则更新（PR-first 自动）"
          if [ -n "$NUMBER" ]; then
            PAYLOAD="$(python3 -c 'import json,os;print(json.dumps({"body":open(os.environ["BODY_FILE"],encoding="utf-8").read()}))')"
            RESP="$(api PATCH "/pulls/${NUMBER}" "$PAYLOAD" 200)"
            printf '%s' "$RESP" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("number"), "PATCH 响应缺少 number";print("♻️ 已更新 PR #%s（body %d 字节）" % (d["number"], len(d.get("body") or "")))'
          else
            PAYLOAD="$(python3 -c 'import json,os;print(json.dumps({"title":os.environ["PR_TITLE"],"head":os.environ["HEAD_BR"],"base":os.environ["BASE_BR"],"body":open(os.environ["BODY_FILE"],encoding="utf-8").read()}))')"
            RESP="$(api POST "/pulls" "$PAYLOAD" 201)"
            NUMBER="$(printf '%s' "$RESP" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("number"), "POST 响应缺少 number";print(d["number"])')"
            echo "✅ 已创建 PR #${NUMBER}（App 身份，将正常触发 pull_request 验证）"
          fi
          echo "pr_number=${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: 🔎 一致性校验（PR 真实 head SHA / 候选分支 ref / 预期 SHA 三者一致）
        id: consistency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          PR_NUM="${{ steps.pr.outputs.pr_number }}"
          EXPECTED="${{ steps.push.outputs.expected_head_sha }}"
          get() {
            local out code body
            out="$(curl -sS -H "Authorization: Bearer ${APP_TOKEN}" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" -w $'\n%{http_code}' "$1")"
            code="$(printf '%s' "$out" | tail -n1)"
            body="$(printf '%s' "$out" | sed '$d')"
            test "$code" = "200" || { echo "❌ GET $1 -> HTTP $code" >&2; return 1; }
            printf '%s' "$body"
          }
          PR_HEAD="$(get "${API}/pulls/${PR_NUM}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["head"]["sha"])')"
          REF_SHA="$(get "${API}/git/ref/heads/${CANDIDATE_BRANCH}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["object"]["sha"])')"
          python3 "$RUNNER_TEMP/trusted/candidate_sha.py" verify \
            --expected "$EXPECTED" --pr-head "$PR_HEAD" --branch-ref "$REF_SHA" \
            --json "$RUNNER_TEMP/candidate-consistency.json"
          echo "head_sha=${PR_HEAD}" >> "$GITHUB_OUTPUT"
          echo "✅ 一致性校验通过：head=${PR_HEAD}"

      - name: 📊 状态摘要（artifact；不含任何秘密）
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.consistency.outputs.head_sha }}
          EXPECTED_SHA: ${{ steps.push.outputs.expected_head_sha }}
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          AUTOMERGE_FLAG: ${{ vars.CANDIDATE_AUTOMERGE_ENABLED }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os; print(json.dumps({
            "candidate_branch": os.environ["CANDIDATE_BRANCH"],
            "base_branch": os.environ["BASE_BRANCH"],
            "base_sha": os.environ["BASE_SHA"],
            "pr_number": os.environ["PR_NUMBER"],
            "verified_pr_head_sha": os.environ["HEAD_SHA"],
            "expected_head_sha": os.environ["EXPECTED_SHA"],
            "auto_merge_gate": os.environ.get("AUTOMERGE_FLAG", ""),
            "writes": ["candidate branch push (GITHUB_TOKEN)", "PR create/update (GITHUB_TOKEN)", "route-a/verify status (GITHUB_TOKEN)"]},
            ensure_ascii=False, indent=2))' > "$RUNNER_TEMP/candidate-summary.json"
          cat "$RUNNER_TEMP/candidate-summary.json"

      - name: ⬆️ 上传状态摘要
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: candidate-summary
          path: ${{ runner.temp }}/candidate-summary.json
          retention-days: 7
          if-no-files-found: ignore

  verify:
    name: verify
    needs: [gate, generate, publish]
    if: needs.gate.outputs.enabled == 'true' && needs.publish.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read        # 只读候选树（tarball/compare）
      pull-requests: read
      statuses: write       # 仅在精确 head SHA 上发布 route-a/verify
    steps:
      - name: 📥 检出默认分支（受信脚本来源；不执行候选内容）
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: python3 -m pip install pyyaml

      - name: 🛡️ 受信验证候选树（范围/防自我削弱/规则集/配置）
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if python3 scripts/ci/verify_candidate.py --repo "${GITHUB_REPOSITORY}" \
              --base-sha "${{ needs.generate.outputs.base_sha }}" \
              --head-sha "${{ needs.publish.outputs.head_sha }}" \
              --json "$RUNNER_TEMP/candidate-verify.json"; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=受信校验通过（范围/规则集/配置）" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=受信校验失败（详见 artifact）" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚦 在精确 head SHA 上发布 route-a/verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/publish_status.py --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ needs.publish.outputs.pr_number }}" \
            --head-sha "${{ needs.publish.outputs.head_sha }}" \
            --state "${{ steps.verify.outputs.state }}" \
            --description "${{ steps.verify.outputs.description }}" \
            --target-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --json "$RUNNER_TEMP/status.json"

      - name: 📊 摘要与证据
        if: always()
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/candidate-verify.json" 2>/dev/null || true
          cat "$RUNNER_TEMP/status.json" 2>/dev/null || true

      - name: ⬆️ 上传验证证据
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: route-a-verify
          path: |
            ${{ runner.temp }}/candidate-verify.json
            ${{ runner.temp }}/status.json
          retention-days: 7
          if-no-files-found: ignore

  finalize:
    name: finalize
    needs: [gate, lock, generate, publish, verify]
    if: always() && needs.lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 📥 检出默认分支（受信脚本）
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: 🧾 写终态（成功）/ 失败关闭（失败）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          RC=0
          if [ "$VERIFY_RESULT" = "success" ] && [ "$PUBLISH_RESULT" = "success" ]; then
            python3 scripts/ci/gate_lock.py --repo "${GITHUB_REPOSITORY}" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              complete --result success --pr "${{ needs.publish.outputs.pr_number }}" || RC=$?
          else
            python3 scripts/ci/gate_lock.py --repo "${GITHUB_REPOSITORY}" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              pause --reason "publish/verify 失败：publish=$PUBLISH_RESULT verify=$VERIFY_RESULT" || RC=$?
          fi
          exit "$RC"

      - name: 📊 终态回读（审计证据）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/gate_lock.py --repo "${GITHUB_REPOSITORY}" status \
            | tee "$RUNNER_TEMP/gate-state.json" || true

      - name: ⬆️ 上传状态证据
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gate-state
          path: |
            ${{ runner.temp }}/lock.json
            ${{ runner.temp }}/gate-state.json
          retention-days: 14
          if-no-files-found: ignore

  request-auto-merge:
    name: request-auto-merge
    needs: [gate, lock, generate, publish, verify, finalize]
    if: needs.gate.outputs.enabled == 'true' && needs.publish.outputs.publish_skipped != 'true' && vars.CANDIDATE_AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: read
      # provenance 身份认证需要读取 workflow run / job 元数据（actions/runs、actions/runs/{id}/jobs）。
      # 仅只读；绝不使用 actions: write / write-all。
      actions: read
    steps:
      - name: 📥 检出默认分支（只用其脚本；不执行候选内容）
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: ⏳ 有界等待必需检查完成（只读轮询；不做任何写请求）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/await_checks.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ needs.publish.outputs.pr_number }}" \
            --expected-head-sha "${{ needs.publish.outputs.head_sha }}" \
            --base-branch "$BASE_BRANCH" \
            --timeout 900 --interval 15 --max-interval 60 \
            --json "$RUNNER_TEMP/await-checks.json"

      - name: 🔒 严格必需检查验证（success 白名单 + 来源绑定 + head SHA 绑定）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_required_checks.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ needs.publish.outputs.pr_number }}" \
            --head-sha "${{ needs.publish.outputs.head_sha }}" \
            --json "$RUNNER_TEMP/required-checks.json"

      - name: 🚦 请求 auto-merge（严格区分 请求成功 / 已启用 / 已合并）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/request_automerge.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ needs.publish.outputs.pr_number }}" \
            --head-sha "${{ needs.publish.outputs.head_sha }}" \
            --json "$RUNNER_TEMP/automerge.json"

      - name: 📊 合并后回读（PR 状态 / merge commit / 默认分支 HEAD）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ needs.publish.outputs.pr_number }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" "${API}/pulls/${PR}" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print(json.dumps({"state":d["state"],"merged":d["merged"],"merge_commit_sha":d.get("merge_commit_sha"),"head_sha":d["head"]["sha"],"auto_merge":d.get("auto_merge")},ensure_ascii=False))'
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" "${API}/git/ref/heads/${BASE_BRANCH}" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print(json.dumps({"base_head":d["object"]["sha"]}))'
